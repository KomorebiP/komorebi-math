[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-math"
version = "1.0.0b4"
description = "Executable packet mathematics with typed finite expression calculus, exact integration, general coordinates, nonlinear calculus, and portable exports"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Komorebi P."}
]
keywords = [
  "operator theory",
  "packet calculus",
  "seed rank",
  "structured mathematics",
  "exact computation",
  "generating functions",
  "coordinate transforms",
  "companion matrices",
  "automatic sequences",
  "p-adic arithmetic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
exact = ["sympy>=1.14"]
scientific = ["scipy>=1.11", "mpmath>=1.3"]
plot = ["matplotlib>=3.8"]
yaml = ["PyYAML>=6.0"]
jax = ["jax>=0.4"]
torch = ["torch>=2.1"]
autodiff = ["jax>=0.4", "torch>=2.1"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "mypy>=1.10", "ruff>=0.6", "mkdocs>=1.6"]
all = ["sympy>=1.14", "scipy>=1.11", "mpmath>=1.3", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.scripts]
komorebi = "komorebi_math.cli.main:main"

[project.entry-points."komorebi_math.extensions"]

[project.urls]
Repository = "https://github.com/KomorebiP/komorebi-math"
Documentation = "https://github.com/KomorebiP/komorebi-math/tree/main/docs"
Issues = "https://github.com/KomorebiP/komorebi-math/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
komorebi_math = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "optional_backend: integration check executed in a crash-isolated child interpreter",
]
filterwarnings = [
  'ignore:`torch\.jit\.script` is deprecated.*:DeprecationWarning:torch\.jit\._script',
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
