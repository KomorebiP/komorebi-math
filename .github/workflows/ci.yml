name: CPU release qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools==82.0.1" wheel
      - run: python -m pip install -e ".[test,exact,scientific,yaml]" setuptools wheel
      - run: python verification/build_block21_distributions.py --root . --output-directory release/dist --report release/CI_REPAIR_DISTRIBUTION_BUILD.json
      - run: python -m pytest -q --tb=short tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m komorebi_math api check --strict-signatures
      - run: python -m komorebi_math api check --stable
      - run: python -m komorebi_math verify stable
      - run: python -m komorebi_math verify block20
      - run: python -m komorebi_math release qualify
      - run: python verification/block21_publication_gate.py --skip-mkdocs --output release/CI_BLOCK21.json --markdown release/CI_BLOCK21.md
      - run: python -m pip check

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools==82.0.1" wheel
      - name: Install minimum supported CPU dependency line
        run: python -m pip install -e ".[test,exact,scientific,yaml]" "numpy==1.26.4" "sympy==1.14.0" "scipy==1.11.4" "mpmath==1.3.0" setuptools wheel
      - run: python verification/build_block21_distributions.py --root . --output-directory release/dist --report release/CI_MINIMUM_DISTRIBUTION_BUILD.json
      - run: python -m pytest -q --tb=short tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m komorebi_math api check --strict-signatures
      - run: python -m komorebi_math api check --stable
      - run: python -m komorebi_math verify stable
      - run: python -m komorebi_math verify block20
      - run: python -m komorebi_math release qualify
      - run: python -m pip check

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools==82.0.1" wheel
      - run: python -m pip install -e ".[test,exact,scientific,yaml]" setuptools wheel mkdocs "pymdown-extensions==10.16.1"
      - run: python verification/build_block21_distributions.py --root . --output-directory release/dist --report release/CI_REPAIR_DISTRIBUTION_BUILD.json
      - run: python -m mkdocs build --strict
      - run: python verification/check_math_docs.py --site-dir site --output release/CI_MATH_DOCS.json
      - run: python verification/check_release_manual.py --output release/CI_MANUAL_EXAMPLES.json
      - run: python verification/block21_publication_gate.py --require-mkdocs --output release/CI_DOCS_BLOCK21.json --markdown release/CI_DOCS_BLOCK21.md
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.sha }}
          path: |
            site/
            release/CI_MATH_DOCS.json
            release/CI_MANUAL_EXAMPLES.json
          if-no-files-found: error

  stress-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,exact,scientific,yaml]"
      - name: Run every requested stress case and bounded resource control
        run: python verification/stress_release_candidate.py --revision "${{ github.sha }}" --timeout 180 --total-timeout 300 --output-directory release/CI_STRESS
        env:
          PYTEST_ADDOPTS: "-k deliberately_unmatched_release_control"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-replay-${{ github.sha }}
          path: release/CI_STRESS/*
          if-no-files-found: error

  optional-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools==82.0.1" wheel
      - name: Install the qualified CPU autodiff dependency line
        run: |
          python -m pip install -e ".[test,exact,scientific,yaml]" "jax==0.11.2" "jaxlib==0.11.2"
          python -m pip install "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Require all requested CPU backend checks to execute
        run: python verification/stress_release_candidate.py --campaign optional_backends --skip-resources --revision "${{ github.sha }}" --timeout 180 --total-timeout 300 --output-directory release/CI_OPTIONAL_STRESS
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-cpu-stress-${{ github.sha }}
          path: release/CI_OPTIONAL_STRESS/*
          if-no-files-found: error

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip "setuptools==82.0.1" wheel build mkdocs "pymdown-extensions==10.16.1"
      - name: Build byte-reproducible distributions
        run: python verification/build_block21_distributions.py --root . --output-directory release/dist --report release/CI_BLOCK21_DISTRIBUTION_BUILD.json
      - run: python -m pip install numpy
      - name: Prepare dependencies for clean offline artifact qualification
        run: |
          python -m pip download --only-binary=:all: --dest "${{ runner.temp }}/komorebi-wheelhouse" "setuptools==82.0.1" wheel numpy pytest sympy scipy mpmath PyYAML
      - name: Source parity and installed wheel plus sdist regressions
        run: python verification/release_artifact_gate.py --root . --runtime-tests --dependency-mode isolated --wheelhouse "${{ runner.temp }}/komorebi-wheelhouse" --output release/CI_REPAIR_ARTIFACT_GATE.json
        env:
          PYTEST_ADDOPTS: "-k polynomial"
      - run: python -m venv .venv-dist
      - run: .venv-dist/bin/python -m pip install release/dist/*.whl
      - run: .venv-dist/bin/python -m komorebi_math api check --strict-signatures
      - run: .venv-dist/bin/python -m komorebi_math api check --stable
      - run: .venv-dist/bin/python -m komorebi_math verify stable
      - run: .venv-dist/bin/python -m komorebi_math verify block20
      - run: .venv-dist/bin/python -m komorebi_math release qualify
      - uses: actions/upload-artifact@v4
        with:
          name: komorebi-math-${{ github.sha }}
          path: |
            release/dist/*
            release/CI_BLOCK21_DISTRIBUTION_BUILD.json
            release/CI_REPAIR_ARTIFACT_GATE.json
          if-no-files-found: error
